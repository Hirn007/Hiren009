<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<script>
	
	function result()
	{
		
		var science=document.getElementById('science').value;
		var maths=document.getElementById('maths').value;
		var physics=document.getElementById('physics').value;
		
		
		var total;
		total=+science + +maths + +physics;
		document.getElementById('total').innerHTML="Total  is : " + total;
		
		
		var per;
		per=(total/300)*100;
		document.getElementById('per').innerHTML="Per is : " + per + "%";
		
		if(per>=90)
		{
		document.getElementById('grade').innerHTML="Grade : A";
		}
		else if(per>=70)
		{
		document.getElementById('grade').innerHTML="Grade : B";
		}
		else if(per>=50)
		{
		document.getElementById('grade').innerHTML="Grade : C";
		}
		else if(per>=40)
		{
		document.getElementById('grade').innerHTML="Grade : D";
		}
		else
		{
		document.getElementById('grade').innerHTML="fail";
		}
		return false;	
	}
	
</script>


<div class="container mt-3">
  <h2>Marks </h2>
  <form action="#">
    <div class="mb-3 mt-3">
      <label for="email">science:</label>
      <input type="number" class="form-control" id="science" placeholder="Enter science Marks" name="science" required min="0" max="100">
    </div>
     <div class="mb-3 mt-3">
      <label for="email">maths:</label>
      <input type="number" class="form-control" id="maths" placeholder="Enter maths Marks" name="maths" required min="0" max="100">
    </div>
	 <div class="mb-3 mt-3">
      <label for="email">physics:</label>
      <input type="number" class="form-control" id="physics" placeholder="Enter physics Marks" name="physics" required min="0" max="100">
    </div>
    <button type="submit" class="btn btn-primary" onclick="return result()">Submit</button>
  </form>
  
  
  <h1 id="total"></h1>
  <br>
  <h1 id="per"></h1>
   <br>
  <h1 id="grade"></h1>
</div>

</body>
</html>
