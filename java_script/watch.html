<h1 id="date"></h1>
<h2 id="time"></h2>
<script>
 setInterval(watch, 1000);

 function watch() {
   var today = new Date();

   var date = today.getDate() + "/" + 
              (today.getMonth() + 1) + "/" + 
              today.getFullYear();

   var time = today.getHours() + ":" + 
              today.getMinutes() + ":" + 
              today.getSeconds();

   document.getElementById('date').innerHTML = date;
   document.getElementById('time').innerHTML = time;
 }
</script>
